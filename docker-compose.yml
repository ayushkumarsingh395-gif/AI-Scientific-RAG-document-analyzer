version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-nexus-enterprise-secret-key-329847293847293847}
      - DATABASE_PATH=/app/data/nexus_data.db
      - FAISS_PATH=/app/data/faiss_db
      - UPLOAD_PATH=/app/data/uploads
    volumes:
      - nexus_data:/app/data

volumes:
  nexus_data:
